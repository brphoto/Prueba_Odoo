<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="titulo-activator-main desc-activator-main">
  <title id="titulo-activator-main">Activador</title>
  <desc id="desc-activator-main">Llave sobre un escudo, para licencias y activación</desc>
  <defs>
    <linearGradient id="marco-activator-main" x1="24" y1="18" x2="232" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1F2937"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="marca-activator-main" x1="46" y1="38" x2="215" y2="218" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#B45309"/>
    </linearGradient>
    <filter id="sombra-activator-main" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>

  <!-- Marco, igual en todos los modulos del repositorio -->
  <rect x="24" y="18" width="208" height="220" rx="25" fill="#0B1220"/>
  <rect x="25.5" y="19.5" width="205" height="217" rx="23.5" fill="url(#marco-activator-main)" stroke="#475569" stroke-width="3"/>
  <rect x="38" y="32" width="180" height="180" rx="9" fill="#0A1422" stroke="#334155" stroke-width="2"/>
  <rect x="46" y="40" width="164" height="164" rx="4" fill="url(#marca-activator-main)" filter="url(#sombra-activator-main)"/>

  <!-- Simbolo propio del modulo -->
  <path d="M128 60l52 20v38c0 34-22 60-52 72-30-12-52-38-52-72V80z" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="128" cy="116" r="17" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M128 133v30M128 150h14" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
