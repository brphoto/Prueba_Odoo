<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="titulo-chatroom-notifications desc-chatroom-notifications">
  <title id="titulo-chatroom-notifications">Avisos del chatroom</title>
  <desc id="desc-chatroom-notifications">Campana de notificación</desc>
  <defs>
    <linearGradient id="marco-chatroom-notifications" x1="24" y1="18" x2="232" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1F2937"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="marca-chatroom-notifications" x1="46" y1="38" x2="215" y2="218" gradientUnits="userSpaceOnUse">
