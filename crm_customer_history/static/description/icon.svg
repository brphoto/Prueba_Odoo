<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="titulo-crm-customer-history desc-crm-customer-history">
  <title id="titulo-crm-customer-history">Historial del cliente</title>
  <desc id="desc-crm-customer-history">Reloj con una flecha hacia atrás</desc>
  <defs>
    <linearGradient id="marco-crm-customer-history" x1="24" y1="18" x2="232" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1F2937"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="marca-crm-customer-history" x1="46" y1="38" x2="215" y2="218" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0891B2"/>
      <stop offset="1" stop-color="#155E75"/>
    </linearGradient>
    <filter id="sombra-crm-customer-history" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>

  <!-- Marco, igual en todos los modulos del repositorio -->
  <rect x="24" y="18" width="208" height="220" rx="25" fill="#0B1220"/>
  <rect x="25.5" y="19.5" width="205" height="217" rx="23.5" fill="url(#marco-crm-customer-history)" stroke="#475569" stroke-width="3"/>
  <rect x="38" y="32" width="180" height="180" rx="9" fill="#0A1422" stroke="#334155" stroke-width="2"/>
  <rect x="46" y="40" width="164" height="164" rx="4" fill="url(#marca-crm-customer-history)" filter="url(#sombra-crm-customer-history)"/>

  <!-- Simbolo propio del modulo -->
  <circle cx="132" cy="130" r="56" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M132 98v34l24 14" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M78 96V66M78 96h30" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
