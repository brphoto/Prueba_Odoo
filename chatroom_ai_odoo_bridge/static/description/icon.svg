  <title id="titulo-chatroom-ai-odoo-bridge">Puente con la IA de Odoo</title>
  <desc id="desc-chatroom-ai-odoo-bridge">Dos nodos unidos por un puente</desc>
  <defs>
    <linearGradient id="marco-chatroom-ai-odoo-bridge" x1="24" y1="18" x2="232" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1F2937"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="marca-chatroom-ai-odoo-bridge" x1="46" y1="38" x2="215" y2="218" gradientUnits="userSpaceOnUse">
