  <rect x="25.5" y="19.5" width="205" height="217" rx="23.5" fill="url(#marco-chatroom-ai-odoo-bridge)" stroke="#475569" stroke-width="3"/>
  <rect x="38" y="32" width="180" height="180" rx="9" fill="#0A1422" stroke="#334155" stroke-width="2"/>
  <rect x="46" y="40" width="164" height="164" rx="4" fill="url(#marca-chatroom-ai-odoo-bridge)" filter="url(#sombra-chatroom-ai-odoo-bridge)"/>

  <!-- Simbolo propio del modulo -->
