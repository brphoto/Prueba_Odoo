  <rect x="38" y="32" width="180" height="180" rx="9" fill="#111827" stroke="#334155" stroke-width="2"/>
  <rect x="46" y="40" width="164" height="164" rx="18" fill="url(#agent)" filter="url(#shadow)"/>

  <!-- Agente con auricular -->
