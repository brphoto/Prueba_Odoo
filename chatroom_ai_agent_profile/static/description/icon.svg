<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="frame" x1="25" y1="20" x2="230" y2="238" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1F2937"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="agent" x1="46" y1="36" x2="216" y2="218" gradientUnits="userSpaceOnUse">
