  <path d="M62 170c4-26 25-42 50-42s46 16 50 42z" fill="#F8FAFC"/>
  <path d="M80 98a32 32 0 0 1 64 0" fill="none" stroke="#1F2937" stroke-width="6" stroke-linecap="round"/>
